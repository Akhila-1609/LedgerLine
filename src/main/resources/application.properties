spring.application.name=ledgerline

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/ledgerline_db
spring.datasource.username=ledgerline_user
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=${PORT:8080}

# Security
spring.security.user.name=${APP_USERNAME}
spring.security.user.password=${APP_PASSWORD}